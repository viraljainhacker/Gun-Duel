<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>Gun Duel - 2 Player</title>

<style>

/* =====================================================
   BASIC
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #1a1a2e;
    color: #eee;
    font-family: Arial, sans-serif;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding: 15px;

    overflow-x: hidden;
}


/* =====================================================
   TITLE
===================================================== */

h1 {
    margin: 5px 0 12px;
    font-size: 28px;
    letter-spacing: 2px;
    text-align: center;
}


/* =====================================================
   MODE SCREEN
===================================================== */

#modeScreen {
    display: flex;
    flex-direction: column;
    align-items: center;

    gap: 16px;

    padding: 35px 15px;
}

#modeScreen p {
    color: #aaa;
    margin: 0;
}

.modeBtn {
    width: 270px;

    padding: 15px;

    font-size: 18px;

    border-radius: 10px;
    border: 2px solid #555;

    background: #2b2b45;
    color: white;

    cursor: pointer;

    transition: 0.2s;
}

.modeBtn:hover {
    background: #3b3b60;
    border-color: #888;
}

.modeBtn:active {
    transform: scale(0.97);
}


/* =====================================================
   GAME AREA
===================================================== */

#gameArea {
    display: none;

    width: 100%;

    flex-direction: column;
    align-items: center;
}


/* =====================================================
   HEALTH / HUD
===================================================== */

#hud {
    width: 900px;
    max-width: 95vw;

    display: flex;
    justify-content: space-between;

    margin-bottom: 6px;
}

.healthbox {
    width: 45%;
}

.healthbox .name {
    font-weight: bold;
    margin-bottom: 4px;
}

.bar-bg {
    width: 100%;
    height: 22px;

    background: #333;

    border: 2px solid #555;
    border-radius: 6px;

    overflow: hidden;
}

.bar-fill {
    height: 100%;

    transition: width 0.15s;
}

#p1fill {
    background: linear-gradient(
        90deg,
        #ff5252,
        #ff8a80
    );
}

#p2fill {
    background: linear-gradient(
        90deg,
        #448aff,
        #82b1ff
    );
}


/* =====================================================
   SCORE
===================================================== */

#score {
    color: #aaa;
    font-size: 14px;

    text-align: center;

    margin-bottom: 5px;
}


/* =====================================================
   GAME CANVAS
===================================================== */

.wrap {
    position: relative;

    width: 900px;
    max-width: 95vw;
}

canvas {
    display: block;

    width: 100%;
    height: auto;

    background: #2b2b45;

    border: 3px solid #555;
    border-radius: 8px;
}


/* =====================================================
   WIN MESSAGE
===================================================== */

#msg {
    position: absolute;

    top: 40%;
    left: 0;

    width: 100%;

    text-align: center;

    font-size: 40px;
    font-weight: bold;

    color: white;

    text-shadow: 0 0 10px black;

    display: none;

    pointer-events: none;
}


/* =====================================================
   RESTART BUTTON
===================================================== */

#restartBtn {
    margin-top: 10px;

    padding: 9px 22px;

    font-size: 16px;

    border: none;
    border-radius: 7px;

    background: #444;
    color: white;

    cursor: pointer;

    display: none;
}

#restartBtn:hover {
    background: #666;
}


/* =====================================================
   DESKTOP KEYBOARD INFO
===================================================== */

#info {
    width: 900px;
    max-width: 95vw;

    display: flex;
    justify-content: space-between;

    font-size: 13px;

    color: #999;

    margin-top: 8px;
}


/* =====================================================
   MOBILE CONTROLS
   DEFAULT = COMPLETELY HIDDEN
===================================================== */

#mobileControls {
    display: none;

    width: 100%;
    max-width: 900px;

    margin-top: 10px;

    padding: 4px;

    user-select: none;
    -webkit-user-select: none;

    touch-action: none;
}


/* PLAYER CONTROL ROW */

.mobilePlayerControls {
    width: 100%;

    display: flex;

    justify-content: space-between;
    align-items: center;

    padding: 8px 2px;
}


/* PLAYER 2 DEFAULT HIDDEN */

#p2Controls {
    display: none;
}


/* CONTROL GROUP */

.controlGroup {
    display: flex;

    align-items: center;

    gap: 8px;
}


/* =====================================================
   MOBILE BUTTON
===================================================== */

.controlBtn {
    width: 58px;
    height: 58px;

    border-radius: 15px;

    border: 2px solid #666;

    background: #292945;

    color: white;

    font-size: 25px;
    font-weight: bold;

    cursor: pointer;

    touch-action: none;

    user-select: none;
    -webkit-user-select: none;

    display: flex;
    align-items: center;
    justify-content: center;

    box-shadow:
        0 4px 8px rgba(0,0,0,0.4);

    transition:
        transform 0.08s,
        background 0.08s;
}


/* BUTTON PRESSED */

.controlBtn.pressed {
    transform: scale(0.90);

    background: #5b5b80;
}


/* JUMP */

.jumpBtn {
    background: #17618f;

    border-color: #55aee8;
}


/* CROUCH */

.crouchBtn {
    background: #444;
}


/* SHOOT */

.shootBtn {
    width: 72px;
    height: 72px;

    border-radius: 50%;

    font-size: 30px;

    background: #8b2020;

    border-color: #ff6666;

    box-shadow:
        0 4px 12px rgba(255,0,0,0.25);
}

.shootBtn.pressed {
    background: #c33131;
}


/* =====================================================
   MOBILE DEVICE CLASS
===================================================== */

body.mobile-device {
    padding: 6px;
}

body.mobile-device h1 {
    font-size: 23px;
    margin: 4px 0 7px;
}

body.mobile-device #mobileControls {
    display: block;
}

body.mobile-device #info {
    display: none;
}

body.mobile-device .wrap {
    width: 100%;
    max-width: 100%;
}

body.mobile-device canvas {
    width: 100%;
    max-width: 100%;
    height: auto;
}

body.mobile-device #hud {
    width: 100%;
    max-width: 100%;
}

body.mobile-device .healthbox {
    width: 47%;
}

body.mobile-device .bar-bg {
    height: 18px;
}

body.mobile-device .healthbox .name {
    font-size: 13px;
}

body.mobile-device #score {
    font-size: 12px;
}

body.mobile-device #msg {
    font-size: 28px;
}


/* =====================================================
   TWO PLAYER MOBILE
===================================================== */

body.mobile-device.twoPlayerMode #p2Controls {
    display: flex;
}

body.mobile-device.twoPlayerMode #p1Controls {
    border-bottom: 1px solid #444;
    padding-bottom: 10px;
}

body.mobile-device.twoPlayerMode #p2Controls {
    padding-top: 10px;
}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media (max-width: 400px) {

    body.mobile-device .controlGroup {
        gap: 5px;
    }

    body.mobile-device .controlBtn {
        width: 50px;
        height: 50px;

        font-size: 21px;
    }

    body.mobile-device .shootBtn {
        width: 64px;
        height: 64px;

        font-size: 27px;
    }
}


/* =====================================================
   VERY SMALL MOBILE
===================================================== */

@media (max-width: 330px) {

    body.mobile-device .controlBtn {
        width: 45px;
        height: 45px;

        font-size: 19px;
    }

    body.mobile-device .shootBtn {
        width: 58px;
        height: 58px;

        font-size: 24px;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     TITLE
===================================================== -->

<h1>🔫 GUN DUEL 🔫</h1>


<!-- =====================================================
     MODE SCREEN
===================================================== -->

<div id="modeScreen">

    <p>Choose a mode</p>

    <button
        class="modeBtn"
        id="botModeBtn">

        1 Player — vs Bot

    </button>


    <button
        class="modeBtn"
        id="pvpModeBtn">

        2 Players — vs Friend

    </button>

</div>


<!-- =====================================================
     GAME AREA
===================================================== -->

<div id="gameArea">


    <!-- =================================================
         HUD
    ================================================== -->

    <div id="hud">

        <div class="healthbox">

            <div
                class="name"
                style="color:#ff5252">

                Player 1

            </div>

            <div class="bar-bg">

                <div
                    class="bar-fill"
                    id="p1fill"
                    style="width:100%">
                </div>

            </div>

        </div>


        <div
            class="healthbox"
            style="text-align:right">

            <div
                class="name"
                style="color:#448aff">

                Player 2

            </div>

            <div class="bar-bg">

                <div
                    class="bar-fill"
                    id="p2fill"
                    style="width:100%">
                </div>

            </div>

        </div>

    </div>


    <!-- =================================================
         SCORE
    ================================================== -->

    <div id="score">

        Score —
        Player 1:
        <span id="s1">0</span>

        &nbsp; | &nbsp;

        Player 2:
        <span id="s2">0</span>

    </div>


    <!-- =================================================
         GAME CANVAS
    ================================================== -->

    <div class="wrap">

        <canvas
            id="game"
            width="900"
            height="450">
        </canvas>

        <div id="msg"></div>

    </div>


    <!-- =================================================
         RESTART
    ================================================== -->

    <button id="restartBtn">
        Restart Round
    </button>


    <!-- =================================================
         DESKTOP CONTROLS
    ================================================== -->

    <div id="info">

        <div>

            <b>Player 1:</b>

            A/D Move,
            W Jump,
            S Crouch,
            SPACE Shoot

        </div>


        <div id="p2info">

            <b>Player 2:</b>

            ←/→ Move,
            ↑ Jump,
            ↓ Crouch,
            ENTER Shoot

        </div>

    </div>


    <!-- =================================================
         MOBILE TOUCH CONTROLS
    ================================================== -->

    <div id="mobileControls">


        <!-- =============================================
             PLAYER 1 CONTROLS
        ============================================== -->

        <div
            class="mobilePlayerControls"
            id="p1Controls">


            <!-- MOVE -->

            <div class="controlGroup">

                <button
                    class="controlBtn"
                    data-key="KeyA">

                    ◀

                </button>


                <button
                    class="controlBtn"
                    data-key="KeyD">

                    ▶

                </button>

            </div>


            <!-- ACTION -->

            <div class="controlGroup">

                <button
                    class="controlBtn jumpBtn"
                    data-key="KeyW">

                    🔼

                </button>


                <button
                    class="controlBtn crouchBtn"
                    data-key="KeyS">

                    🔽

                </button>


                <button
                    class="controlBtn shootBtn"
                    data-key="Space">

                    🔫

                </button>

            </div>

        </div>


        <!-- =============================================
             PLAYER 2 CONTROLS
        ============================================== -->

        <div
            class="mobilePlayerControls"
            id="p2Controls">


            <!-- MOVE -->

            <div class="controlGroup">

                <button
                    class="controlBtn"
                    data-key="ArrowLeft">

                    ◀

                </button>


                <button
                    class="controlBtn"
                    data-key="ArrowRight">

                    ▶

                </button>

            </div>


            <!-- ACTION -->

            <div class="controlGroup">

                <button
                    class="controlBtn jumpBtn"
                    data-key="ArrowUp">

                    🔼

                </button>


                <button
                    class="controlBtn crouchBtn"
                    data-key="ArrowDown">

                    🔽

                </button>


                <button
                    class="controlBtn shootBtn"
                    data-key="Enter">

                    🔫

                </button>

            </div>

        </div>

    </div>

</div>


<script>


/* =====================================================
   MOBILE DEVICE DETECTION
   Android / iPhone / iPad ONLY
   Laptop buttons will stay hidden
===================================================== */

const mobileDevice =
    /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|Mobile/i
    .test(navigator.userAgent);

if (mobileDevice) {

    document.body.classList.add(
        "mobile-device"
    );

}


/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const W =
    canvas.width;

const H =
    canvas.height;

const GROUND_Y =
    H - 50;

const GRAVITY =
    0.6;


/* =====================================================
   PLAYER CREATION
===================================================== */

function makePlayer(
    x,
    color,
    facing
) {

    return {

        x: x,

        y: GROUND_Y - 60,

        w: 30,

        h: 60,

        vx: 0,

        vy: 0,

        color: color,

        facing: facing,

        health: 100,

        onGround: true,

        crouch: false,

        cooldown: 0,

        hitFlash: 0,

        score: 0

    };

}


/* =====================================================
   GAME VARIABLES
===================================================== */

let p1 =
    makePlayer(
        150,
        "#ff5252",
        1
    );

let p2 =
    makePlayer(
        720,
        "#448aff",
        -1
    );

let bullets = [];

let keys = {};

let roundOver = false;

let botMode = false;

let started = false;


/* =====================================================
   MODE BUTTONS
===================================================== */

document
    .getElementById("botModeBtn")
    .addEventListener(
        "click",
        function() {

            startGame(true);

        }
    );


document
    .getElementById("pvpModeBtn")
    .addEventListener(
        "click",
        function() {

            startGame(false);

        }
    );


/* =====================================================
   START GAME
===================================================== */

function startGame(isBot) {

    botMode = isBot;

    document
        .getElementById("modeScreen")
        .style.display = "none";


    document
        .getElementById("gameArea")
        .style.display = "flex";


    if (botMode) {

        document.body
            .classList.remove(
                "twoPlayerMode"
            );


        document
            .getElementById("p2info")
            .innerHTML =
            "<b>Player 2:</b> Bot (CPU controlled)";

    }

    else {

        document.body
            .classList.add(
                "twoPlayerMode"
            );


        document
            .getElementById("p2info")
            .innerHTML =
            "<b>Player 2:</b> ←/→ Move, ↑ Jump, ↓ Crouch, ENTER Shoot";

    }


    if (!started) {

        started = true;

        update();

    }

}


/* =====================================================
   BOT AI
===================================================== */

let botState = {

    decisionTimer: 0,

    moveDir: 0,

    wantJump: false,

    wantCrouch: false

};


function updateBotAI() {

    botState.decisionTimer--;

    const dist =
        p1.x - p2.x;

    const absDist =
        Math.abs(dist);


    if (
        botState.decisionTimer <= 0
    ) {

        botState.decisionTimer =
            20 +
            Math.floor(
                Math.random() * 20
            );


        if (absDist > 350) {

            botState.moveDir =
                dist > 0
                    ? 1
                    : -1;

        }

        else if (absDist < 150) {

            botState.moveDir =
                dist > 0
                    ? -1
                    : 1;

        }

        else {

            botState.moveDir =
                Math.random() < 0.3
                    ? (
                        Math.random() < 0.5
                            ? 1
                            : -1
                    )
                    : 0;

        }


        botState.wantJump =
            Math.random() < 0.15 &&
            p2.onGround;


        botState.wantCrouch =
            Math.random() < 0.3;

    }


    p2.vx = 0;


    if (
        botState.moveDir === -1
    ) {

        p2.vx = -4;

        p2.facing = -1;

    }


    if (
        botState.moveDir === 1
    ) {

        p2.vx = 4;

        p2.facing = 1;

    }


    p2.facing =
        dist > 0
            ? 1
            : -1;


    if (
        botState.wantJump &&
        p2.onGround
    ) {

        p2.vy = -12;

        p2.onGround = false;

        botState.wantJump = false;

    }


    p2.crouch =
        botState.wantCrouch &&
        p2.onGround;


    if (
        p2.cooldown === 0 &&
        Math.random() < 0.06
    ) {

        shoot(p2);

    }

}


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    function(e) {

        keys[e.code] = true;


        if (
            [
                "Space",
                "ArrowUp",
                "ArrowDown",
                "ArrowLeft",
                "ArrowRight"
            ].includes(e.code)
        ) {

            e.preventDefault();

        }

    }
);


document.addEventListener(
    "keyup",
    function(e) {

        keys[e.code] = false;

    }
);


/* =====================================================
   SHOOT
===================================================== */

function shoot(p) {

    if (
        p.cooldown > 0 ||
        roundOver
    ) {

        return;

    }


    p.cooldown = 18;


    bullets.push({

        x:
            p.x +
            (
                p.facing === 1
                    ? p.w
                    : 0
            ),

        y:
            p.y +
            (
                p.crouch
                    ? p.h * 0.7
                    : p.h * 0.3
            ),

        vx:
            11 * p.facing,

        owner:
            p

    });

}


/* =====================================================
   UPDATE GAME
===================================================== */

function update() {

    if (!roundOver) {


        /* =============================================
           PLAYER 1
        ============================================== */

        p1.vx = 0;


        if (keys["KeyA"]) {

            p1.vx = -4;

            p1.facing = -1;

        }


        if (keys["KeyD"]) {

            p1.vx = 4;

            p1.facing = 1;

        }


        if (
            keys["KeyW"] &&
            p1.onGround
        ) {

            p1.vy = -12;

            p1.onGround = false;

        }


        p1.crouch =
            !!keys["KeyS"] &&
            p1.onGround;


        if (keys["Space"]) {

            shoot(p1);

        }


        /* =============================================
           PLAYER 2
        ============================================== */

        if (botMode) {

            updateBotAI();

        }

        else {

            p2.vx = 0;


            if (keys["ArrowLeft"]) {

                p2.vx = -4;

                p2.facing = -1;

            }


            if (keys["ArrowRight"]) {

                p2.vx = 4;

                p2.facing = 1;

            }


            if (
                keys["ArrowUp"] &&
                p2.onGround
            ) {

                p2.vy = -12;

                p2.onGround = false;

            }


            p2.crouch =
                !!keys["ArrowDown"] &&
                p2.onGround;


            if (keys["Enter"]) {

                shoot(p2);

            }

        }


        /* =============================================
           PHYSICS
        ============================================== */

        [p1, p2].forEach(
            function(p) {

                p.x += p.vx;

                p.vy += GRAVITY;

                p.y += p.vy;


                if (
                    p.y + p.h >=
                    GROUND_Y
                ) {

                    p.y =
                        GROUND_Y - p.h;

                    p.vy = 0;

                    p.onGround = true;

                }


                p.x =
                    Math.max(
                        0,
                        Math.min(
                            W - p.w,
                            p.x
                        )
                    );


                if (
                    p.cooldown > 0
                ) {

                    p.cooldown--;

                }


                if (
                    p.hitFlash > 0
                ) {

                    p.hitFlash--;

                }

            }
        );


        /* =============================================
           PREVENT PLAYER OVERLAP
        ============================================== */

        if (p1.x < p2.x) {

            if (
                p1.x + p1.w >
                p2.x
            ) {

                p1.x =
                    p2.x - p1.w;

            }

        }

        else {

            if (
                p2.x + p2.w >
                p1.x
            ) {

                p2.x =
                    p1.x - p2.w;

            }

        }


        /* =============================================
           BULLETS
        ============================================== */

        bullets.forEach(
            function(b) {

                b.x += b.vx;

            }
        );


        bullets =
            bullets.filter(
                function(b) {


                    if (
                        b.x < 0 ||
                        b.x > W
                    ) {

                        return false;

                    }


                    const target =
                        b.owner === p1
                            ? p2
                            : p1;


                    const targetHeight =
                        target.crouch
                            ? target.h * 0.6
                            : target.h;


                    const targetY =
                        target.crouch
                            ? target.y +
                              target.h * 0.4
                            : target.y;


                    if (
                        b.x > target.x &&
                        b.x <
                        target.x + target.w &&

                        b.y > targetY &&

                        b.y <
                        targetY + targetHeight
                    ) {

                        target.health -= 12;

                        target.hitFlash = 8;


                        if (
                            target.health <= 0
                        ) {

                            target.health = 0;

                            endRound(
                                b.owner
                            );

                        }


                        return false;

                    }


                    return true;

                }
            );


        updateHUD();

    }


    draw();

    requestAnimationFrame(update);

}


/* =====================================================
   HUD
===================================================== */

function updateHUD() {

    document
        .getElementById("p1fill")
        .style.width =
        p1.health + "%";


    document
        .getElementById("p2fill")
        .style.width =
        p2.health + "%";

}


/* =====================================================
   END ROUND
===================================================== */

function endRound(winner) {

    roundOver = true;

    winner.score++;


    document
        .getElementById(
            winner === p1
                ? "s1"
                : "s2"
        )
        .textContent =
        winner.score;


    const msg =
        document.getElementById(
            "msg"
        );


    msg.style.display = "block";

    msg.style.color =
        winner.color;


    msg.textContent =
        (
            winner === p1
                ? "PLAYER 1"
                : "PLAYER 2"
        ) +
        " WINS!";


    document
        .getElementById(
            "restartBtn"
        )
        .style.display =
        "inline-block";

}


/* =====================================================
   DRAW PLAYER
===================================================== */

function drawPlayer(p) {

    ctx.save();


    if (p.hitFlash > 0) {

        ctx.globalAlpha = 0.5;

    }


    const bodyH =
        p.crouch
            ? p.h * 0.6
            : p.h;


    const bodyY =
        p.crouch
            ? p.y + p.h * 0.4
            : p.y;


    /* BODY */

    ctx.fillStyle =
        p.color;

    ctx.fillRect(
        p.x,
        bodyY,
        p.w,
        bodyH
    );


    /* HEAD */

    ctx.beginPath();

    ctx.arc(
        p.x + p.w / 2,
        bodyY - 8,
        10,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* GUN */

    ctx.fillStyle =
        "#222";


    const gunY =
        bodyY +
        bodyH * 0.35;


    if (
        p.facing === 1
    ) {

        ctx.fillRect(
            p.x + p.w,
            gunY,
            18,
            6
        );

    }

    else {

        ctx.fillRect(
            p.x - 18,
            gunY,
            18,
            6
        );

    }


    ctx.restore();

}


/* =====================================================
   DRAW GAME
===================================================== */

function draw() {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    /* BACKGROUND */

    const grad =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );


    grad.addColorStop(
        0,
        "#2b2b45"
    );


    grad.addColorStop(
        1,
        "#3a3a5c"
    );


    ctx.fillStyle =
        grad;


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* GROUND */

    ctx.fillStyle =
        "#444460";


    ctx.fillRect(
        0,
        GROUND_Y,
        W,
        H - GROUND_Y
    );


    ctx.strokeStyle =
        "#5a5a80";


    ctx.beginPath();

    ctx.moveTo(
        0,
        GROUND_Y
    );

    ctx.lineTo(
        W,
        GROUND_Y
    );

    ctx.stroke();


    /* PLAYERS */

    drawPlayer(p1);

    drawPlayer(p2);


    /* BULLETS */

    bullets.forEach(
        function(b) {

            ctx.fillStyle =
                "#ffd54f";


            ctx.beginPath();


            ctx.arc(
                b.x,
                b.y,
                4,
                0,
                Math.PI * 2
            );


            ctx.fill();

        }
    );

}


/* =====================================================
   RESTART
===================================================== */

document
    .getElementById(
        "restartBtn"
    )
    .addEventListener(
        "click",
        function() {

            const score1 =
                p1.score;

            const score2 =
                p2.score;


            p1 =
                makePlayer(
                    150,
                    "#ff5252",
                    1
                );


            p2 =
                makePlayer(
                    720,
                    "#448aff",
                    -1
                );


            p1.score =
                score1;

            p2.score =
                score2;


            bullets = [];

            roundOver = false;


            document
                .getElementById(
                    "msg"
                )
                .style.display =
                "none";


            document
                .getElementById(
                    "restartBtn"
                )
                .style.display =
                "none";


            updateHUD();

        }
    );


/* =====================================================
   MOBILE TOUCH CONTROLS
===================================================== */

const controlButtons =
    document.querySelectorAll(
        ".controlBtn"
    );


controlButtons.forEach(
    function(button) {

        const key =
            button.dataset.key;


        /* ---------------------------------------------
           PRESS
        --------------------------------------------- */

        function press(e) {

            e.preventDefault();

            keys[key] = true;

            button.classList.add(
                "pressed"
            );

        }


        /* ---------------------------------------------
           RELEASE
        --------------------------------------------- */

        function release(e) {

            e.preventDefault();

            keys[key] = false;

            button.classList.remove(
                "pressed"
            );

        }


        /* TOUCH START */

        button.addEventListener(
            "touchstart",
            press,
            {
                passive: false
            }
        );


        /* TOUCH END */

        button.addEventListener(
            "touchend",
            release,
            {
                passive: false
            }
        );


        /* TOUCH CANCEL */

        button.addEventListener(
            "touchcancel",
            release,
            {
                passive: false
            }
        );


        /* POINTER SUPPORT */

        button.addEventListener(
            "pointerdown",
            function(e) {

                if (
                    e.pointerType !==
                    "touch"
                ) {
                    return;
                }

                press(e);

            }
        );


        button.addEventListener(
            "pointerup",
            function(e) {

                if (
                    e.pointerType !==
                    "touch"
                ) {
                    return;
                }

                release(e);

            }
        );


        button.addEventListener(
            "pointercancel",
            function(e) {

                if (
                    e.pointerType !==
                    "touch"
                ) {
                    return;
                }

                release(e);

            }
        );

    }
);


/* =====================================================
   INITIAL
===================================================== */

updateHUD();

</script>

</body>
</html>
