<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Gun Duel - 50 Levels</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:#101426;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    overflow-x:hidden;
}

button{
    border:0;
    color:white;
    cursor:pointer;
}

#menu{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.menuBox{
    width:95%;
    max-width:500px;
    padding:35px;
    background:#1d2440;
    border:2px solid #465174;
    border-radius:20px;
    box-shadow:0 20px 60px #0008;
}

.menuBox h1{
    font-size:42px;
    margin:5px;
}

.menuBox p{
    color:#aab3d5;
}

.startBtn{
    width:100%;
    padding:16px;
    margin-top:15px;
    background:#315f9c;
    border-radius:10px;
    font-size:19px;
}

.startBtn:hover{
    background:#4078c0;
}

#game{
    display:none;
    padding:8px;
}

.top{
    max-width:1100px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.top h1{
    margin:5px;
    font-size:28px;
}

.levelBox{
    font-size:20px;
    font-weight:bold;
}

.difficulty{
    color:#ffd740;
    font-size:14px;
}

#hud{
    max-width:1100px;
    margin:5px auto;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
}

.playerHUD{
    width:180px;
}

.hpBg{
    height:15px;
    background:#333;
    border:1px solid #666;
    border-radius:6px;
    overflow:hidden;
}

.hp{
    height:100%;
    transition:.15s;
}

canvas{
    display:block;
    width:100%;
    max-width:1100px;
    height:auto;
    margin:8px auto;
    border:3px solid #555d80;
    border-radius:12px;
    background:#252a43;
}

#keyboard{
    color:#8e96b4;
    font-size:13px;
}

#mobileControls{
    display:none;
    max-width:700px;
    margin:8px auto;
    justify-content:space-between;
    align-items:center;
    touch-action:none;
}

.controlGroup{
    display:flex;
    gap:8px;
}

.control{
    width:60px;
    height:60px;
    border-radius:12px;
    background:#293250;
    border:2px solid #555f85;
    font-size:23px;
    user-select:none;
}

.fire{
    width:75px;
    height:75px;
    border-radius:50%;
    background:#a12f38;
    font-size:28px;
}

.overlay{
    position:fixed;
    inset:0;
    background:#000c;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:20;
}

.overlayBox{
    width:90%;
    max-width:430px;
    padding:35px;
    background:#202742;
    border:2px solid #657198;
    border-radius:20px;
    box-shadow:0 20px 70px #000;
}

.overlayBox h2{
    font-size:30px;
}

.overlayIcon{
    font-size:70px;
}

.overlayBtn{
    width:100%;
    padding:14px;
    margin-top:10px;
    border-radius:9px;
    background:#3568a7;
    font-size:17px;
}

.hidden{
    display:none!important;
}

@media(max-width:700px){

    #mobileControls{
        display:flex;
    }

    #keyboard{
        display:none;
    }

    .top h1{
        font-size:20px;
    }

    .levelBox{
        font-size:16px;
    }

    .difficulty{
        font-size:11px;
    }

    .control{
        width:52px;
        height:52px;
    }

    .fire{
        width:68px;
        height:68px;
    }

    .menuBox h1{
        font-size:32px;
    }
}
</style>
</head>

<body>

<!-- ================= MENU ================= -->

<div id="menu">

<div class="menuBox">

<h1>🔫 GUN DUEL</h1>

<p>50 LEVEL OFFLINE CHALLENGE</p>

<button class="startBtn" onclick="startGame()">
START GAME
</button>

</div>

</div>


<!-- ================= GAME ================= -->

<div id="game">

<div class="top">

<h1>🔫 GUN DUEL</h1>

<div class="levelBox">
LEVEL <span id="level">1</span> / 50
</div>

<div class="difficulty" id="difficulty">
BEGINNER
</div>

</div>


<div id="hud"></div>


<canvas id="canvas"
width="1100"
height="550">
</canvas>


<div id="keyboard">
A / D = Move &nbsp;
W = Jump &nbsp;
S = Crouch &nbsp;
SPACE = Shoot
</div>


<!-- MOBILE -->

<div id="mobileControls">

<div class="controlGroup">

<button class="control" data-key="left">
◀
</button>

<button class="control" data-key="right">
▶
</button>

</div>


<div class="controlGroup">

<button class="control" data-key="jump">
🔼
</button>

<button class="control" data-key="crouch">
🔽
</button>

<button class="fire" data-key="fire">
🔫
</button>

</div>

</div>

</div>


<!-- ================= LEVEL COMPLETE ================= -->

<div id="levelWin" class="overlay hidden">

<div class="overlayBox">

<div class="overlayIcon">🏆</div>

<h2>LEVEL COMPLETE!</h2>

<p>
You defeated all enemies.
</p>

<h3>
LEVEL <span id="completedLevel">1</span> CLEARED
</h3>

<button class="overlayBtn" onclick="nextLevel()">
NEXT LEVEL →
</button>

</div>

</div>


<!-- ================= GAME OVER ================= -->

<div id="gameOver" class="overlay hidden">

<div class="overlayBox">

<div class="overlayIcon">💀</div>

<h2>GAME OVER</h2>

<p>You were defeated.</p>

<button class="overlayBtn" onclick="restartLevel()">
TRY AGAIN
</button>

</div>

</div>


<!-- ================= FINAL ================= -->

<div id="finalWin" class="overlay hidden">

<div class="overlayBox">

<div class="overlayIcon">👑</div>

<h2>CHAMPION!</h2>

<p>You completed all 50 levels!</p>

<h3>🔥 LEVEL 50 DEFEATED 🔥</h3>

<button class="overlayBtn" onclick="location.reload()">
PLAY AGAIN
</button>

</div>

</div>


<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const W=canvas.width;
const H=canvas.height;

const GROUND=H-60;

const GRAVITY=.6;


let level=1;
let running=false;
let levelFinished=false;

let bullets=[];
let particles=[];

let keys={};

let player;

let bots=[];


/* =========================
PLAYER
========================= */

function createPlayer(){

return{

x:100,
y:GROUND-60,

w:32,
h:60,

vx:0,
vy:0,

speed:5,

health:100,

maxHealth:100,

alive:true,

onGround:true,

crouch:false,

facing:1,

cooldown:0

};

}


/* =========================
BOT
========================= */

function createBot(){

let difficulty=level/50;

return{

x:150+Math.random()*(W-300),

y:GROUND-60,

w:30,
h:60,

vx:0,
vy:0,

speed:
2.0+
difficulty*4,

health:
60+
level*5,

maxHealth:
60+
level*5,

alive:true,

onGround:true,

crouch:false,

facing:-1,

cooldown:
Math.random()*40

};

}


/* =========================
START GAME
========================= */

function startGame(){

document.getElementById("menu").style.display="none";

document.getElementById("game").style.display="block";

level=1;

player=createPlayer();

startLevel();

running=true;

gameLoop();

}


/* =========================
START LEVEL
========================= */

function startLevel(){

bullets=[];
particles=[];

levelFinished=false;

player=createPlayer();

bots=[];


/*
Level 1 = 1 bot
Level 2 = 2 bots
...
Level 50 = 50 bots
*/

for(let i=0;i<level;i++){

bots.push(createBot());

}


updateDifficulty();

updateHUD();

}


/* =========================
DIFFICULTY
========================= */

function updateDifficulty(){

let text;

if(level===50)
text="💀 ULTIMATE";

else if(level>=46)
text="☠️ DEMON";

else if(level>=41)
text="👹 LEGENDARY";

else if(level>=36)
text="💀 INSANE";

else if(level>=31)
text="☠️ NIGHTMARE";

else if(level>=26)
text="🔥 EXTREME";

else if(level>=21)
text="🔴 VERY HARD";

else if(level>=16)
text="🟠 HARD";

else if(level>=11)
text="🟡 MEDIUM";

else if(level>=6)
text="🟢 EASY";

else
text="🟢 BEGINNER";

document.getElementById("level")
.textContent=level;

document.getElementById("difficulty")
.textContent=text;

}


/* =========================
KEYBOARD
========================= */

document.addEventListener(
"keydown",
function(e){

keys[e.code]=true;

if([
"Space",
"ArrowUp",
"ArrowDown",
"ArrowLeft",
"ArrowRight"
].includes(e.code)){

e.preventDefault();

}

});


document.addEventListener(
"keyup",
function(e){

keys[e.code]=false;

});


/* =========================
MOBILE CONTROLS
========================= */

document.querySelectorAll(
"[data-key]"
).forEach(button=>{

let action=button.dataset.key;


function press(e){

e.preventDefault();

keys[action]=true;

}


function release(e){

e.preventDefault();

keys[action]=false;

}


button.addEventListener(
"touchstart",
press,
{passive:false}
);

button.addEventListener(
"touchend",
release,
{passive:false}
);

button.addEventListener(
"touchcancel",
release,
{passive:false}
);


/* Mouse also works for testing */

button.addEventListener(
"mousedown",
press
);

button.addEventListener(
"mouseup",
release
);

button.addEventListener(
"mouseleave",
release
);

});


/* =========================
PLAYER UPDATE
========================= */

function updatePlayer(){

if(!player.alive)return;


player.vx=0;


if(
keys["KeyA"] ||
keys["ArrowLeft"] ||
keys["left"]
){

player.vx=-player.speed;

player.facing=-1;

}


if(
keys["KeyD"] ||
keys["ArrowRight"] ||
keys["right"]
){

player.vx=player.speed;

player.facing=1;

}


/* Jump */

if(
(
keys["KeyW"] ||
keys["ArrowUp"] ||
keys["jump"]
)
&&
player.onGround
){

player.vy=-12;

player.onGround=false;

}


/* Crouch */

player.crouch=
(
keys["KeyS"] ||
keys["ArrowDown"] ||
keys["crouch"]
)
&&
player.onGround;


/* Shoot */

if(
keys["Space"] ||
keys["Enter"] ||
keys["fire"]
){

shoot(player);

}


physics(player);

}


/* =========================
BOT AI
========================= */

function updateBots(){

bots.forEach(bot=>{

if(!bot.alive)return;


let dx=
player.x-bot.x;

let distance=
Math.abs(dx);


/* Move toward player */

if(distance>140){

bot.vx=
dx>0
?bot.speed
:-bot.speed;

}else{

bot.vx=0;

}


bot.facing=
dx>0?1:-1;


/* Random jump */

if(
bot.onGround &&
Math.random()<
.002+level*.0001
){

bot.vy=-11;

bot.onGround=false;

}


/* Shooting */

if(bot.cooldown>0){

bot.cooldown--;

}else{

/*
Higher levels shoot faster
*/

let chance=
.15+
level*.012;

if(Math.random()<chance){

shoot(bot);

}

bot.cooldown=
Math.max(
7,
30-level*.4
)+
Math.random()*20;

}


physics(bot);

});

}


/* =========================
PHYSICS
========================= */

function physics(p){

p.x+=p.vx;

p.vy+=GRAVITY;

p.y+=p.vy;


if(
p.y+p.h>=GROUND
){

p.y=GROUND-p.h;

p.vy=0;

p.onGround=true;

}


p.x=Math.max(
0,
Math.min(
W-p.w,
p.x
)
);


if(p.cooldown>0){

p.cooldown--;

}

}


/* =========================
SHOOT
========================= */

function shoot(p){

if(
!p.alive ||
p.cooldown>0
)return;


p.cooldown=14;


bullets.push({

x:
p.facing>0
?p.x+p.w
:p.x,

y:
p.y+
(
p.crouch
?p.h*.65
:p.h*.3
),

vx:
13*p.facing,

owner:p

});

}


/* =========================
BULLETS
========================= */

function updateBullets(){

bullets.forEach(
b=>b.x+=b.vx
);


bullets=
bullets.filter(
b=>{

if(
b.x<0 ||
b.x>W
)return false;


let targets=[
player,
...bots
];


for(
let target of targets
){

if(
!target.alive ||
target===b.owner
)continue;


let top=
target.crouch
?target.y+target.h*.4
:target.y;

let height=
target.crouch
?target.h*.6
:target.h;


if(

b.x>target.x &&
b.x<target.x+target.w &&

b.y>top &&
b.y<top+height

){

hit(target);

return false;

}

}


return true;

});

}


/* =========================
HIT
========================= */

function hit(target){

target.health-=20;


/* red non-graphic hit effect */

for(
let i=0;
i<14;
i++
){

particles.push({

x:
target.x+
target.w/2,

y:
target.y+
target.h*.4,

vx:
(Math.random()-.5)*7,

vy:
(Math.random()-.5)*7,

life:
20+
Math.random()*20,

size:
2+
Math.random()*4

});

}


if(
target.health<=0
){

target.health=0;

target.alive=false;

}

}


/* =========================
PARTICLES
========================= */

function updateParticles(){

particles.forEach(p=>{

p.x+=p.vx;

p.y+=p.vy;

p.vy+=.15;

p.life--;

});


particles=
particles.filter(
p=>p.life>0
);

}


/* =========================
CHECK WIN
========================= */

function checkGame(){

if(levelFinished)return;


/* Player dead */

if(!player.alive){

levelFinished=true;

document.getElementById(
"gameOver"
).classList.remove(
"hidden"
);

return;

}


/* Bots left */

let aliveBots=
bots.filter(
b=>b.alive
).length;


if(aliveBots===0){

levelFinished=true;

document.getElementById(
"completedLevel"
).textContent=level;

document.getElementById(
"levelWin"
).classList.remove(
"hidden"
);

}

}


/* =========================
NEXT LEVEL
========================= */

function nextLevel(){

document.getElementById(
"levelWin"
).classList.add(
"hidden"
);


if(level>=50){

document.getElementById(
"finalWin"
).classList.remove(
"hidden"
);

return;

}


level++;

startLevel();

}


/* =========================
RESTART
========================= */

function restartLevel(){

document.getElementById(
"gameOver"
).classList.add(
"hidden"
);

startLevel();

}


/* =========================
HUD
========================= */

function updateHUD(){

let html=`

<div class="playerHUD">

<div style="color:#ff5252">
PLAYER
</div>

<div class="hpBg">

<div
class="hp"
style="
width:${player.health}%;
background:#ff5252">
</div>

</div>

</div>

`;


bots.slice(0,8).forEach(
(bot,i)=>{

html+=`

<div class="playerHUD">

<div style="color:#b66cff">
BOT ${i+1}
</div>

<div class="hpBg">

<div
class="hp"
style="
width:${Math.max(
0,
bot.health/bot.maxHealth*100
)}%;
background:#a855f7">
</div>

</div>

</div>

`;

});


if(bots.length>8){

html+=`

<div style="
padding:10px;
color:#aaa">

+ ${bots.length-8}
more bots

</div>

`;

}


document.getElementById(
"hud"
).innerHTML=html;

}


/* =========================
DRAW
========================= */

function draw(){

ctx.clearRect(
0,0,W,H
);


/* Background */

let gradient=
ctx.createLinearGradient(
0,0,0,H
);

gradient.addColorStop(
0,
"#20243d"
);

gradient.addColorStop(
1,
"#3d4262"
);

ctx.fillStyle=gradient;

ctx.fillRect(
0,0,W,H
);


/* Ground */

ctx.fillStyle="#484d6b";

ctx.fillRect(
0,
GROUND,
W,
H-GROUND
);


/* Draw player */

drawCharacter(
player,
"#ff5252"
);


/* Draw bots */

bots.forEach(
bot=>{
drawCharacter(
bot,
"#a855f7"
);
});


/* Bullets */

bullets.forEach(
b=>{

ctx.fillStyle="#ffd740";

ctx.beginPath();

ctx.arc(
b.x,
b.y,
5,
0,
Math.PI*2
);

ctx.fill();

});


/* Particles */

particles.forEach(
p=>{

ctx.globalAlpha=
Math.max(
0,
p.life/40
);

ctx.fillStyle="#ff3d55";

ctx.fillRect(
p.x,
p.y,
p.size,
p.size
);

});

ctx.globalAlpha=1;

}


/* =========================
CHARACTER
========================= */

function drawCharacter(
p,
color
){

if(!p.alive)return;


let bodyHeight=
p.crouch
?p.h*.6
:p.h;

let bodyY=
p.crouch
?p.y+p.h*.4
:p.y;


ctx.fillStyle=color;

ctx.fillRect(
p.x,
bodyY,
p.w,
bodyHeight
);


/* Head */

ctx.beginPath();

ctx.arc(
p.x+p.w/2,
bodyY-9,
11,
0,
Math.PI*2
);

ctx.fill();


/* Gun */

ctx.fillStyle="#111";

if(p.facing>0){

ctx.fillRect(
p.x+p.w,
bodyY+bodyHeight*.35,
22,
7
);

}else{

ctx.fillRect(
p.x-22,
bodyY+bodyHeight*.35,
22,
7
);

}

}


/* =========================
GAME LOOP
========================= */

function gameLoop(){

if(!running)return;


if(!levelFinished){

updatePlayer();

updateBots();

updateBullets();

updateParticles();

checkGame();

updateHUD();

}


draw();


requestAnimationFrame(
gameLoop
);

}

</script>

</body>
</html>
