<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no"
    />

    <title>Gun Duel Online</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- =========================
     LOBBY
========================= -->

    <div id="lobby">
      <div class="card">
        <h1>🔫 GUN DUEL</h1>

        <p class="subtitle">ONLINE MULTIPLAYER</p>

        <input id="playerName" maxlength="18" placeholder="Enter your name" />

        <h3>Players</h3>

        <div class="playerSelect">
          <button onclick="selectPlayerCount(1)">1</button>

          <button onclick="selectPlayerCount(2)">2</button>

          <button onclick="selectPlayerCount(3)">3</button>

          <button onclick="selectPlayerCount(4)">4</button>
        </div>

        <p>
          Selected:
          <b id="selectedPlayers">1</b>
          Players
        </p>

        <button class="mainButton" onclick="createRoom()">CREATE ROOM</button>

        <input id="roomInput" maxlength="6" placeholder="Enter Room Code" />

        <button class="mainButton" onclick="joinRoom()">JOIN ROOM</button>

        <div id="roomBox" class="hidden">
          <p>ROOM CODE</p>

          <div id="roomCode">------</div>

          <p class="small">Send this code to your friends.</p>

          <div id="roomPlayers"></div>

          <button
            id="startButton"
            class="mainButton hidden"
            onclick="startOnlineGame()"
          >
            START GAME
          </button>
        </div>

        <p id="status"></p>
      </div>
    </div>

    <!-- =========================
     GAME
========================= -->

    <div id="gameScreen" class="hidden">
      <header>
        <h1>🔫 GUN DUEL</h1>

        <div id="levelInfo">
          LEVEL
          <span id="level"> 1 </span>
          / 50
        </div>

        <div id="difficulty">BEGINNER</div>
      </header>

      <div id="playersHUD"></div>

      <canvas id="gameCanvas" width="1100" height="550"> </canvas>

      <!-- WIN SCREEN -->

      <div id="winScreen" class="overlay hidden">
        <div class="winBox">
          <div class="winIcon">🏆</div>

          <h2>LEVEL COMPLETE!</h2>

          <p>You defeated all enemies.</p>

          <h3>
            LEVEL
            <span id="completedLevel"> 1 </span>
            CLEARED
          </h3>

          <button onclick="nextLevel()">NEXT LEVEL →</button>
        </div>
      </div>

      <!-- GAME OVER -->

      <div id="gameOver" class="overlay hidden">
        <div class="winBox">
          <div class="winIcon">💀</div>

          <h2>GAME OVER</h2>

          <button onclick="restartLevel()">TRY AGAIN</button>
        </div>
      </div>

      <!-- MOBILE CONTROLS -->

      <div id="mobileControls">
        <div class="controlLeft">
          <button class="control" data-action="left">◀</button>

          <button class="control" data-action="right">▶</button>
        </div>

        <div class="controlRight">
          <button class="control jump" data-action="jump">🔼</button>

          <button class="control crouch" data-action="crouch">🔽</button>

          <button class="fire" data-action="fire">🔫</button>
        </div>
      </div>

      <p id="keyboardInfo">
        P1: A D W S SPACE &nbsp; | &nbsp; P2: ← → ↑ ↓ ENTER
      </p>
    </div>

    <script src="/socket.io/socket.io.js"></script>

    <script src="game.js"></script>
  </body>
</html>
